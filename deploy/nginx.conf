# Example nginx site for Legart running on 127.0.0.1:3000 (e.g. `docker compose up -d`).
# Get a certificate first, e.g.: certbot certonly --nginx -d legart.example.com
server {
    listen 80;
    server_name legart.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name legart.example.com;

    ssl_certificate     /etc/letsencrypt/live/legart.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/legart.example.com/privkey.pem;

    # share cards and challenge pictures are sent as JSON data URLs
    client_max_body_size 8m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
